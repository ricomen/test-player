<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Видео</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/video.js@8.21.0/dist/video-js.min.css"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="grid-section" aria-label="Сетка видео">
        <div class="grid-toolbar">
          <button type="button" class="btn" id="shuffleBtn">
            Случайный порядок
          </button>
          <button
            type="button"
            class="btn btn--toggle"
            id="deleteModeBtn"
            aria-pressed="false"
          >
            Режим удаления
          </button>
          <p class="grid-toolbar__hint" id="deleteModeHint" hidden>
            Наведите указку на ролик и нажмите ×. Файл удаляется с диска.
          </p>
        </div>
        <div
          class="video-spotlight"
          id="videoSpotlight"
          hidden
          aria-label="Крупный просмотр"
        >
          <div class="video-spotlight__bar">
            <p class="video-spotlight__title" id="spotlightTitle"></p>
            <button
              type="button"
              class="video-spotlight__close btn"
              id="spotlightClose"
              aria-label="Свернуть"
            >
              Свернуть
            </button>
          </div>
          <div class="video-spotlight__media" id="spotlightMedia"></div>
        </div>
        <ul class="video-grid" id="videoGrid"></ul>
      </section>

      <!-- <section class="thumb-section" aria-label="Превью кадра">
        <h2 class="thumb-section__title">Превью кадра</h2>
        <p class="thumb-section__hint">
          Первый кадр через серверный <code>ffmpeg</code>, результат
          кэшируется.
        </p>
        <p class="thumb-section__status" id="thumbStatus" aria-live="polite">
          Готово к запросу.
        </p>
        <div class="thumb-section__row">
          <label class="thumb-section__label">
            Файл
            <select id="thumbVideoSelect" disabled></select>
          </label>
          <button type="button" class="btn" id="thumbBtn" disabled>
            Первый кадр (JPEG)
          </button>
        </div>
        <div class="thumb-section__preview" id="thumbPreviewWrap" hidden>
          <p class="thumb-section__preview-title">Результат</p>
          <img id="thumbPreviewImg" alt="Кадр из выбранного видео" />
        </div>
      </section> -->
    </main>

    <template id="video-cell-tpl">
      <li class="video-cell">
        <div class="video-cell__media">
          <img
            class="video-cell__poster"
            alt=""
            hidden
            decoding="async"
          />
          <video
            class="video-js vjs-default-skin video-cell__player"
            playsinline
            preload="none"
          ></video>
        </div>
        <button
          type="button"
          class="video-cell__delete"
          aria-label="Удалить файл с диска"
          title="Удалить"
        >
          ×
        </button>
      </li>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/video.js@8.21.0/dist/video.min.js"></script>
    <script type="module" src="/app.js"></script>
    <script type="module" src="/thumb-app.js"></script>
  </body>
</html>
